[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-journey"
version = "0.1.0"
description = "Text-based adventure game with generative AI storytelling played in a terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "boto3>=1.34.0",
    "botocore[crt]",
    "openai>=1.0.0",
]

[project.scripts]
play = "generative_journey.cli:main"

[tool.setuptools.packages.find]
where = ["."]
